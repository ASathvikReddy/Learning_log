{% extends 'learning_logs/base.html' %}


{% block content %}
    <p> Add a New Topic : </p>
    <form action = "{% url 'learning_logs:new_topic'%}" method = 'post'>

        <!-- to prevent attackers from using the form to gain unauthorized access to the server.
            (This kind of attack is called a cross-site request forgery.) -->

        {% csrf_token %} <!-- cross-site request forgery (csrf)-->

        {{ form.as_div }} <!-- The as_div modifier tells Django to render all the form elements as 
                            HTML <div></div> elements this is a simple way to display the form neatly-->

    <button name='submit'> Add Topic </button>
    </form>

{% endblock content %}
